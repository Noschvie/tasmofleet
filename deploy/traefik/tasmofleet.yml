# Example Traefik v3 dynamic configuration (file provider) for tasmofleet.
# example values: single entrypoint "websecure", container at 192.168.1.10.
# OIDC mode (AUTH_MODE=oidc): tasmofleet does the login itself, so no
# forward-auth middleware is attached. The firmware server (port 80) is
# NOT proxied: devices talk to it directly on the container IP.
http:
  routers:
    tasmofleet:
      rule: Host(`tasmofleet.example.com`) || Host(`tasmofleet.example.internal`)
      entryPoints:
        - websecure
      service: tasmofleet
      tls: {}
      # Header mode (AUTH_MODE=header): add the Authentik outpost middleware
      # below and set TRUSTED_PROXIES to the Traefik host.
      # middlewares:
      #   - authentik

  services:
    tasmofleet:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://192.168.1.10:8080
        healthCheck:
          path: /healthz
          interval: 30s
          timeout: 5s

  # middlewares:
  #   authentik:
  #     forwardAuth:
  #       address: http://authentik.example.internal:9000/outpost.goauthentik.io/auth/traefik
  #       trustForwardHeader: true
  #       authResponseHeaders:
  #         - X-authentik-username
  #         - X-authentik-groups
