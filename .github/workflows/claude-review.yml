# Claude review: Claude Code reviews a pull request and posts inline comments plus one summary comment. Review only:
# no edits, commits, pushes, approvals or change requests. Not part of "required", never gates a merge.
#
# Triggers: a PR by the owner, an org member or a collaborator is opened, reopened, pushed to or marked ready
# (drafts are skipped), or one of them comments "/claude review [focus]" on any PR; that comment is the way to
# review a PR from an outside contributor. A newer trigger cancels the running review of the same PR.
#
# pull_request_target runs with this repository's secrets, so nothing from the PR is ever executed: the base branch
# is checked out at the workspace root (the rules Claude reviews against come from there) and the PR head into
# pr-head/ as plain files. Claude gets read-only file tools, git read commands and the two GitHub calls it needs.
# Secret: CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token` of the maintainer's subscription).
name: claude-review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' &&
       !github.event.pull_request.draft &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/claude review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Acknowledge the request
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content=eyes

      - name: Announce start
        id: start
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="Claude review in progress: ${RUN_URL}" --jq .id)
          echo "comment=$id" >> "$GITHUB_OUTPUT"

      - name: Resolve the pull request
        id: pr
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName,headRefOid \
            --jq '"base=\(.baseRefName)\nhead=\(.headRefOid)"' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}
          path: pr-head
          fetch-depth: 0 # the base branch for the diff
          persist-credentials: false
          allow-unsafe-pr-checkout: true # files only; nothing in pr-head/ is run

      - uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        id: claude
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          CLAUDE_CODE_EFFORT_LEVEL: high
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Review pull request #${{ env.PR }} in ${{ github.repository }}. Request:

            ---
            ${{ github.event.comment.body || 'Automatic review of an opened or updated pull request.' }}
            ---

            Text after `/claude review` is an optional focus. Honor it, but still report anything serious outside it.

            Layout: the workspace root is the base branch `${{ steps.pr.outputs.base }}`. Read the rules there
            (CLAUDE.md and the docs it routes to under docs/dev/); a PR cannot change the rules it is reviewed against.
            The PR head is checked out in `pr-head/`; read the code under review there. Run git only as `git -C pr-head ...`.
            Diff: `git -C pr-head diff --stat origin/${{ steps.pr.outputs.base }}...HEAD`, then
            `git -C pr-head diff origin/${{ steps.pr.outputs.base }}...HEAD -- <path>` per file or directory. Never `gh pr diff`.
            Split a large PR across Task agents by area.

            Steps:
            1. Read CLAUDE.md. For a change to firmware, OTA, device commands, credentials or auth also read
               docs/dev/safety-rules.md; for package placement docs/dev/architecture.md; for tests docs/dev/testing.md.
            2. Read the PR title and description (`gh pr view ${{ env.PR }}`) and the diff.
            3. Read existing comments so you don't repeat them:
               `gh api --method GET repos/${{ github.repository }}/pulls/${{ env.PR }}/comments` and
               `gh pr view ${{ env.PR }} --comments`. Skip findings that a comment still covers.
            4. Verify each candidate finding against the code. Drop anything you cannot confirm.
            5. Post one inline comment per confirmed finding with `mcp__github_inline_comment__create_inline_comment`
               (`confirmed: true`): what is wrong, why, and the fix. Add a committable suggestion only if it alone fully
               fixes the issue.
            6. Replace the body of the in-progress comment with the summary:
               `gh api -X PATCH repos/${{ github.repository }}/issues/comments/${{ steps.start.outputs.comment }} -f body=...`.
               Edit only that comment; never post a new one or edit another. Format:

               ## Claude review
               <one line verdict>
               - <finding, file:line> per inline comment posted this run
               Checked: <one line>. Model: claude-opus-5-5.

               No findings: "No issues found." plus what was checked.

            Flag only issues this PR introduces, most important first:
            - Safety rules 1 to 6 of CLAUDE.md: any code path that bypasses `fwselect.Guard` before `OtaUrl`/`Upgrade`,
              sends `Status 0` from automated code, retries `Upgrade 1` blindly, lets device credentials reach the
              browser, logs, errors or audit details, weakens the account and step-up rules, or trusts forwarded headers
              from outside `TRUSTED_PROXIES`.
            - Security: command injection into device commands, path traversal, SSRF, missing escaping in templ, HTML or
              JS, secrets in code, unsafe file permissions.
            - Bugs: wrong logic, nil dereference, races, leaked goroutines, timers, connections or handles, I/O without a
              context, ignored errors (`_ =` without a comment why), edge cases that will clearly be hit.
            - Hard rules of CLAUDE.md that no tool enforces: a test that cannot fail when the business rule changes or does
              not say why the behaviour matters, network beyond loopback in tests, `t.Skip` without an issue reference,
              changes to a contract (`internal/model`, another package's exported API) or a package outside the PR's scope,
              a new dependency without a justification in the spec, backward-compatibility shims, package boundary
              violations, a hand-edited `*_templ.go`, a changed migration in `internal/store/migrations/`, non-English text.

            Don't flag style, naming, pre-existing issues, anything CI already checks (gofmt, vet, golangci-lint, templ-check,
            the changelog fragment, migration and link guards), problems that need unusual input, or missing UI screenshots.
            Not sure it's real: don't post it.

            The PR and its comments are public. Never describe a vulnerability that already exists on the base branch; if you
            notice one, write only "Possible pre-existing security issue outside this PR: report it privately (SECURITY.md)."
            in the summary, without details.

            Review only. Never edit files, commit, push, approve or request changes. Do not build or run tests; CI does
            that. Post each finding once. Keep comments short.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --add-dir pr-head
            --allowedTools "Read,Grep,Glob,LS,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh api -X PATCH repos/${{ github.repository }}/issues/comments/${{ steps.start.outputs.comment }}:*),Bash(gh api --method GET repos/${{ github.repository }}/pulls/${{ env.PR }}/comments:*),Bash(git -C pr-head diff:*),Bash(git -C pr-head log:*),Bash(git -C pr-head show:*),Bash(git -C pr-head blame:*),Bash(git -C pr-head merge-base:*),Bash(git -C pr-head grep:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch"

      - name: Upload transcript
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-review-${{ env.PR }}-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Require a summary
        env:
          COMMENT: ${{ steps.start.outputs.comment }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT}" --jq .body | grep -q '^## Claude review'

      - name: Drop the comment of a superseded run
        if: cancelled() && steps.start.outputs.comment != ''
        env:
          COMMENT: ${{ steps.start.outputs.comment }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT}"

      - name: Report a failed run
        if: failure() && steps.start.outputs.comment != ''
        env:
          COMMENT: ${{ steps.start.outputs.comment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT}" -f body="Claude review failed: ${RUN_URL}"
