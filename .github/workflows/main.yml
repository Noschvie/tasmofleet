# Push to main: publishes :edge and keeps the Go caches fresh. It runs no test: the pushed
# commit is the head of a pull request that was green, because main only moves forward by
# a fast-forward push of that head (CLAUDE.md "Pull requests and the protected main"), so a
# rerun of the FAST tier would only repeat the PR (#478).
#
# Pull requests do not save Go caches (#476): a cache saved under refs/pull/N/merge can only
# be restored by that PR. The caches the PRs restore are saved by this workflow and by
# nightly.yml, and only from main (.github/actions/go). The cache-warm job fills the ones
# of lint, unit tests, build and integration tests without running a test: it compiles the
# test binaries and lints, which is what the caches are for. The e2e cache is refreshed by
# the nightly.
#
# Jobs:
#   cache-warm      compile and lint, nothing is checked that the PR did not check
#   image           build and push :edge (_image.yml, mode edge), and build-test the HA app image
#   ghcr-cleanup    prune the registries after the image, whatever its result
name: main

on:
  push:
    branches: [main]
    # Nothing here changes the image or the caches: docs, e2e tests, design files, fixtures and
    # the workflows of the other triggers.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "e2e/**"
      - "design/**"
      - "testdata/**"
      - ".github/workflows/pr.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/nightly.yml"
      - ".github/workflows/_checks.yml"
      - ".github/workflows/_mutation.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

env:
  NICE: ""

jobs:
  cache-warm:
    name: Go cache (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Same cache names and same go invocations as the jobs of _checks.yml, so that the entries
        # saved here are the ones those jobs restore. -run=NoSuchTest compiles and links every
        # test binary (build flags and tags are what the cache keys on) and runs no test.
        include:
          - name: lint
            cache_paths: ~/.cache/golangci-lint
            run: make lint
          - name: test
            cache_paths: ""
            run: make build test TESTFLAGS=-run=NoSuchTest
          - name: integration
            cache_paths: ""
            run: make integration TESTFLAGS=-run=NoSuchTest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/go
        with:
          name: ${{ matrix.name }}
          paths: ${{ matrix.cache_paths }}
      - run: ${{ matrix.run }}

  image:
    name: image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      mode: edge
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  ghcr-cleanup:
    name: ghcr-cleanup
    needs: image
    # After the image build, whatever its result (a failed push can leave partial images behind).
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr-cleanup.yml
    with:
      dry-run: false
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
