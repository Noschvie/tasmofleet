# CI for tasmofleet on GitHub-hosted runners. Every gate runs through the
# Makefile, so the same commands work locally. Runners are pinned to
# ubuntu-24.04 in every workflow (no silent image switch when ubuntu-latest
# moves); bump them together and deliberately.
#
# Two tiers (CLAUDE.md "Running the gates"):
#   FAST (pull requests, push to main): lint, unit and integration tests from
#     the go test cache, the @core e2e tests in two shards, and, when a PR
#     changes a SAFETY package (Makefile), its race tests and the mutation gate
#     of the changed mutation packages. Target: "required" green in <= 5 min.
#     Push to main runs the same jobs (the PR already proved them); it keeps
#     main's caches fresh, which PR runs restore from.
#   RELEASE (tags v*): the FAST tier (cached tests, the @core e2e tests in two
#     shards) plus, always and not only when changed, the race tests of the
#     SAFETY packages (a tag has no PR base, so safety-race runs every one),
#     and the early changelog and migration guards. No mutation: every PR that
#     touches a SAFETY package already passed mutation-changed, and the
#     nightly FULL runs the whole mutation. A tag publishes the image
#     (image.yml, called below) only after this tier passed; then the job
#     "release" makes the GitHub release from the CHANGELOG.md section.
#   FULL (nightly cron, manual dispatch): additionally the whole e2e suite in
#     three shards (layout and visual guards), every unit test with the race
#     detector, the Tasmota command catalogue check (make catalogue-check, docs-anchors-check),
#     uncached test runs (TESTFLAGS=-count=1) and the full mutation run.
#     It blocks no release; a failure opens an issue (job nightly-failure-issue).
#   QUARANTINE (nightly and dispatch only, never blocking): the tests tagged
#     @quarantine / quarantine.Test, with retries; one "flaky" issue each.
# Docs-only PRs skip the heavy jobs (the "changes" job decides; docs.yml checks
# links). The job "required" is the single status check for branch protection.
#
# paths-ignore lists only files no test or build reads. NOT docs-only:
# docs/security (cmdpolicy test reads command-policy.md), docs/configuration.md
# (configdoc_test checks it against the env tags), docs/spec
# (design-system.md is read by a test), assets/branding (branding test compares
# copies), deploy (metrics/config tests read it), design/v2 (token test),
# testdata, internal/web/static and templates (embedded).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/research/**"
      - "docs/runbooks/**"
      - "docs/design/**"
      - "README.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - "CLAUDE.md"
      - "NOTICE"
      - "LICENSE"
  # No paths-ignore for PRs: the "changes" job decides, and "required" always reports.
  pull_request:
  schedule:
    - cron: "23 2 * * *" # nightly FULL + quarantine on main
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group: a push to main must not cancel the nightly run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NICE: ""

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      tier: ${{ steps.classify.outputs.tier }}
      safety: ${{ steps.classify.outputs.safety }}
      shards: ${{ steps.classify.outputs.shards }}
      catalogue: ${{ steps.classify.outputs.catalogue }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          code=true
          safety=false
          catalogue=false
          tier=fast
          case "$EVENT" in schedule|workflow_dispatch) tier=full ;; esac
          if [ "$REF_TYPE" = tag ]; then
            # RELEASE tier: FAST plus the race tests of the SAFETY packages, always.
            tier=release
            safety=true
            # Release guard, early: the image job checks it again before publishing.
            make changelog-check TAG="$REF_NAME"
            # Patch releases never touch the migrations.
            make migration-guard TAG="$REF_NAME" REV="$GITHUB_SHA"
          fi
          if [ "$EVENT" = pull_request ]; then
            # Fail closed: without a base or a diff, the gate fails instead of
            # treating the PR as docs-only.
            [ -n "$BASE" ] || { echo "no base sha"; exit 1; }
            files=$(git diff --name-only "$BASE"...HEAD)
            [ -n "$files" ] || { echo "empty diff"; exit 1; }
            echo "$files"
            code=false
            for f in $files; do
              case "$f" in
                docs/research/*|docs/runbooks/*|docs/design/*|README.md|ROADMAP.md|CONTRIBUTING.md|SECURITY.md|CHANGELOG.md|CLAUDE.md|NOTICE|LICENSE) ;;
                *) code=true ;;
              esac
            done
            # The SAFETY list lives in the Makefile (make safety uses it too).
            dirs=$(sed -n 's/^SAFETY *:= *//p' Makefile | tr ' ' '\n' | sed 's|^\./||; /^$/d')
            [ -n "$dirs" ] || { echo "no SAFETY list in the Makefile"; exit 1; }
            for d in $dirs; do
              if echo "$files" | grep -q "^$d/"; then safety=true; fi
            done
            # The catalogue generator, its data and the pinned source (Makefile) decide the catalogue job.
            if echo "$files" | grep -Eq '^(internal/tasmotacmd/|cmd/tasmofleet-catalogue/|Makefile$)'; then catalogue=true; fi
          fi
          if [ "$tier" = full ]; then shards='["1/3","2/3","3/3"]'; else shards='["1/2","2/2"]'; fi
          {
            echo "code=$code"
            echo "tier=$tier"
            echo "safety=$safety"
            echo "catalogue=$catalogue"
            echo "shards=$shards"
          } >> "$GITHUB_OUTPUT"
          echo "code=$code tier=$tier safety=$safety shards=$shards"

  lint:
    name: templ, fmt, vet, staticcheck, golangci-lint, govulncheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/go
        with:
          name: lint
          paths: |
            ~/.cache/golangci-lint
            ~/.cache/staticcheck
      - run: make templ-check fmt-check vet staticcheck lint vuln shards-check

  test:
    name: unit tests, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # git-mtimes.sh
      - uses: ./.github/actions/go
        with:
          name: test
          mtimes: "true"
      - env:
          TESTFLAGS: ${{ needs.changes.outputs.tier == 'full' && '-count=1' || '' }}
        run: make test build

  integration:
    name: integration tests (real decode-config)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # git-mtimes.sh
      - uses: ./.github/actions/go
        with:
          name: integration
          mtimes: "true"
      - name: install decode-config (pinned, verified)
        env:
          DECODER_VERSION: v16.0.0
          DECODER_SHA256: b92b8465fec5a940306cb24becb1365c0b4e56fd6695445a890ff4aec6287d6c
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/dc.tgz" "https://github.com/tasmota/decode-config/releases/download/$DECODER_VERSION/decode-config-ubuntu-24.04.tar.gz"
          echo "$DECODER_SHA256  $RUNNER_TEMP/dc.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/decode-config" && tar -xzf "$RUNNER_TEMP/dc.tgz" -C "$RUNNER_TEMP/decode-config" decode-config
          "$RUNNER_TEMP/decode-config/decode-config" --version
      - name: integration tests
        env:
          REQUIRE_DECODER: "1"
          TESTFLAGS: ${{ needs.changes.outputs.tier == 'full' && '-count=1' || '' }}
        run: DECODER_PATH="$RUNNER_TEMP/decode-config/decode-config" make integration

  e2e:
    name: e2e ${{ needs.changes.outputs.tier == 'full' && 'all' || 'core' }} (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    container:
      # The image is the browser cache: its browsers and fonts match
      # @playwright/test in e2e/package.json; bump both together.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: install make (not in the Playwright image)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null
      - uses: actions/checkout@v7.0.1
      # The job container runs as root on a workspace owned by the runner user;
      # without this git refuses the repository and go build cannot stamp VCS info.
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/go
        with:
          name: e2e
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('e2e/package-lock.json') }}
      - name: install e2e dependencies
        run: make e2e-deps
      - name: e2e tests
        env:
          CI: "true"
          TARGET: ${{ needs.changes.outputs.tier == 'full' && 'e2e' || 'e2e-core' }}
          SHARD: ${{ matrix.shard }}
        run: |
          # One worker per two cores: every worker runs its own app, simulator
          # fleet and browser, and more made layout and timing tests flaky.
          n=$(( $(nproc) / 2 )); [ "$n" -lt 1 ] && n=1
          # The MQTT specs are not sharded: the first shard runs them once.
          mqtt=1; [ "${SHARD%%/*}" = 1 ] || mqtt=0
          E2E_WORKERS=$n make "$TARGET" E2E_ARGS="--shard=$SHARD" E2E_MQTT=$mqtt
      - name: upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # FAST tier, only when a PR changes a SAFETY package: its race tests (all of
  # them on a tag, which has no base to diff against) ...
  safety-race:
    name: safety race tests (changed safety packages)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.safety == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # diff against the PR base
      - uses: ./.github/actions/go
        with:
          name: race
          save: "false"
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          AUTH_PARTS: "4"
        run: make safety-race BASE="$BASE"

  # ... and the mutation gate of the changed mutation packages (see "mutation").
  race:
    name: unit tests (race detector, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # tools/race.sh: 1/2 is internal/auth alone (about half of all race time, run in 4
        # parts), 2/2 every other package; make shards-check fails when a package is in neither.
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/go
        with:
          name: race-${{ strategy.job-index }}
      - env:
          RACE_SHARD: ${{ matrix.shard }}
          AUTH_PARTS: "4"
        run: make race

  # FULL tier, and PRs touching the generator, its data or the Makefile: the checked-in Tasmota command catalogue must equal a regeneration from the pinned
  # Tasmota source (the only job that downloads it; the unit tests never use the network).
  catalogue:
    name: Tasmota command catalogue
    needs: changes
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.tier == 'full' || needs.changes.outputs.catalogue == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/go
        with:
          name: catalogue
      - id: pin
        run: echo "sha=$(sed -n '/^TASMOTA_PINS/,/^TASMOTA_CACHE/p' Makefile | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/tasmofleet
          key: tasmota-src-${{ steps.pin.outputs.sha }}
      - run: make catalogue-check
      - run: make docs-anchors-check

  # Mutation testing in four shards (one ota run alone takes 11 minutes on
  # one runner): each shard mutates its share of the files of all packages, dealt
  # out by estimated cost (tools/mutation-shard.sh), and
  # uploads the counts; mutation-gate adds them up and applies the thresholds.
  # FULL tier: every MUTATION package. FAST tier: only for PRs that change a
  # SAFETY package, and only the changed mutation packages (mutation-changed).
  # RELEASE tier (tags): no mutation.
  mutation:
    name: mutation tests (${{ needs.changes.outputs.tier == 'full' && 'all' || 'changed' }}, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.tier == 'full' || (needs.changes.outputs.tier == 'fast' && needs.changes.outputs.safety == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"] # keep in step with MUTATION_CI_SHARDS (Makefile)
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # mutation-changed diffs against the PR base
      - uses: ./.github/actions/go
        with:
          name: mutation
          save: ${{ needs.changes.outputs.tier == 'full' }}
      - env:
          TARGET: ${{ needs.changes.outputs.tier == 'full' && 'mutation' || 'mutation-changed' }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          # The marker keeps the artifact non-empty when no mutation package changed.
          mkdir -p "$RUNNER_TEMP/counts" && echo "$SHARD" > "$RUNNER_TEMP/counts/shard"
          make "$TARGET" BASE="$BASE" MUTATION_SHARD="$SHARD" MUTATION_COUNTS="$RUNNER_TEMP/counts"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mutation-counts-${{ strategy.job-index }}
          path: ${{ runner.temp }}/counts
          if-no-files-found: error
          retention-days: 3

  mutation-gate:
    name: mutation gate
    needs: [changes, mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v7.0.0
        with:
          pattern: mutation-counts-*
          path: ${{ runner.temp }}/counts
      - env:
          ALL: ${{ needs.changes.outputs.tier == 'full' && '1' || '' }}
        run: make mutation-sum MUTATION_COUNTS="$RUNNER_TEMP/counts" MUTATION_SHARDS=4 MUTATION_ALL="$ALL"

  # Known-flaky tests, nightly (and dispatch) only, with retries. Never part of
  # "required": a failure here shows on the run but does not fail it.
  quarantine:
    name: quarantined tests (retries, not blocking)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: install make and gcc (race detector)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends make gcc libc6-dev >/dev/null
      - uses: actions/checkout@v7.0.1
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/go
        with:
          name: e2e
          save: "false"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('e2e/package-lock.json') }}
      - run: make e2e-deps
      - name: quarantined Go tests
        if: always()
        run: make test-quarantine
      - name: quarantined e2e tests
        if: always()
        env:
          CI: "true"
        run: E2E_WORKERS=2 make e2e-quarantine

  # The one status that branch protection on main requires. It always runs and
  # passes only when every job that had to run passed. A job may be skipped
  # only when its tier did not ask for it: everything for a docs-only PR, the
  # safety jobs when no SAFETY package changed, race and full mutation outside
  # the FULL tier. Any other result (failure, cancelled, or a skip caused by a
  # failed dependency) fails it. Mutation runs in FULL and for safety PRs, not on tags.
  required:
    name: required
    needs: [changes, lint, test, integration, e2e, safety-race, mutation, mutation-gate, race, catalogue]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: all gates passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TIER: ${{ needs.changes.outputs.tier }}
          SAFETY: ${{ needs.changes.outputs.safety }}
          ALWAYS: ${{ needs.lint.result }} ${{ needs.test.result }} ${{ needs.integration.result }} ${{ needs.e2e.result }}
          SAFETY_JOBS: ${{ needs.safety-race.result }}
          MUTATION: ${{ needs.mutation.result }} ${{ needs.mutation-gate.result }}
          FULL_ONLY: ${{ needs.race.result }}
          CATALOGUE: ${{ needs.catalogue.result }}
          CAT_CHANGED: ${{ needs.changes.outputs.catalogue }}
        run: |
          echo "changes=$CHANGES code=$CODE tier=$TIER safety=$SAFETY"
          echo "always: $ALWAYS | safety: $SAFETY_JOBS | mutation: $MUTATION | full only: $FULL_ONLY"
          [ "$CHANGES" = success ] || exit 1
          docs=false; [ "$CODE" = false ] && docs=true
          check() { # check <skip allowed> <result...>
            allowed=$1; shift
            for r in "$@"; do
              [ "$r" = success ] && continue
              [ "$r" = skipped ] && [ "$allowed" = true ] && continue
              echo "unexpected result: $r"; exit 1
            done
          }
          check "$docs" $ALWAYS
          s=$docs; [ "$SAFETY" = true ] || s=true
          check "$s" $SAFETY_JOBS
          f=$docs; [ "$TIER" = full ] || f=true
          check "$f" $FULL_ONLY
          c=$docs; [ "$TIER" = full ] || [ "$CAT_CHANGED" = true ] || c=true
          check "$c" $CATALOGUE
          m=$docs; [ "$TIER" = full ] || { [ "$TIER" = fast ] && [ "$SAFETY" = true ]; } || m=true
          check "$m" $MUTATION

  # The nightly FULL blocks no release, so its failure must not go unseen: one
  # open issue "Nightly FULL failed ..." (labels ci, flaky) collects the runs;
  # a later failing night comments on it instead of opening a second one.
  nightly-failure-issue:
    name: nightly failure issue
    needs: [changes, lint, test, integration, e2e, safety-race, mutation, mutation-gate, race, catalogue]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read # gh run view --json jobs
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          failed=$(gh run view "$RUN_ID" --json jobs -q '.jobs[] | select(.conclusion == "failure") | "- " + .name')
          printf 'Run: %s\n\nFailed jobs:\n\n%s\n' "$RUN_URL" "$failed" > body.md
          open=$(gh issue list --label ci --state open --json number,title -q '[.[] | select(.title | startswith("Nightly FULL failed"))][0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
          else
            gh issue create --title "Nightly FULL failed on main ($day)" --label flaky --label ci --body-file body.md
          fi

  # Release: a tag publishes the image only when the RELEASE tier passed.
  publish:
    name: publish image (tags)
    needs: required
    # An explicit status check: the implicit success() also looks at the skipped
    # ancestors of "required" (safety-race, quarantine) and would skip this job.
    if: ${{ !cancelled() && needs.required.result == 'success' && github.ref_type == 'tag' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    secrets: inherit # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN for the Docker Hub copy

  # A GitHub release per tag, its notes the CHANGELOG.md section, once the image is out.
  release:
    name: GitHub release (tags)
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          make -s changelog-notes TAG="$TAG" > notes.md
          title=$(make -s changelog-title TAG="$TAG")
          pre=; case "$TAG" in *-*) pre=--prerelease ;; esac
          gh release create "$TAG" --verify-tag --title "$title" --notes-file notes.md $pre
