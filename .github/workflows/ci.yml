# CI for tasmofleet on GitHub-hosted runners. Every gate runs through the
# Makefile, so the same commands work locally. Runners are pinned to
# ubuntu-24.04 in every workflow (no silent image switch when ubuntu-latest
# moves); bump them together and deliberately.
#
# Two tiers (CLAUDE.md "Running the gates"):
#   FAST (pull requests, push to main): lint, unit and integration tests from
#     the go test cache, the @core e2e tests in two shards, and, when a PR
#     changes a SAFETY package (Makefile), its race tests and the mutation gate
#     of the changed mutation packages. Target: "required" green in <= 5 min.
#     Push to main runs the same jobs (the PR already proved them); it keeps
#     main's caches fresh, which PR runs restore from.
#   FULL (nightly cron, tags v*, manual dispatch): additionally the whole
#     e2e suite in three shards, every unit test with the race detector,
#     uncached test runs (TESTFLAGS=-count=1) and the full mutation run.
#     A tag publishes the image (image.yml, called below) only after FULL
#     passed, and fails early when CHANGELOG.md has no section for it.
#   QUARANTINE (nightly and dispatch only, never blocking): the tests tagged
#     @quarantine / quarantine.Test, with retries; one "flaky" issue each.
# Docs-only PRs skip the heavy jobs (the "changes" job decides; docs.yml checks
# links). The job "required" is the single status check for branch protection.
#
# paths-ignore lists only files no test or build reads. NOT docs-only:
# docs/security (cmdpolicy test reads command-policy.md), docs/spec
# (design-system.md is read by a test), assets/branding (branding test compares
# copies), deploy (metrics/config tests read it), design/v2 (token test),
# testdata, internal/web/static and templates (embedded).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/research/**"
      - "docs/runbooks/**"
      - "docs/design/**"
      - "README.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - "CLAUDE.md"
      - "NOTICE"
      - "LICENSE"
  # No paths-ignore for PRs: the "changes" job decides, and "required" always reports.
  pull_request:
  schedule:
    - cron: "23 2 * * *" # nightly FULL + quarantine on main
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group: a push to main must not cancel the nightly run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NICE: ""

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      tier: ${{ steps.classify.outputs.tier }}
      safety: ${{ steps.classify.outputs.safety }}
      shards: ${{ steps.classify.outputs.shards }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          code=true
          safety=false
          tier=fast
          case "$EVENT" in schedule|workflow_dispatch) tier=full ;; esac
          if [ "$REF_TYPE" = tag ]; then
            tier=full
            # Release guard, early: the image job checks it again before publishing.
            make changelog-check TAG="$REF_NAME"
          fi
          if [ "$EVENT" = pull_request ]; then
            # Fail closed: without a base or a diff, the gate fails instead of
            # treating the PR as docs-only.
            [ -n "$BASE" ] || { echo "no base sha"; exit 1; }
            files=$(git diff --name-only "$BASE"...HEAD)
            [ -n "$files" ] || { echo "empty diff"; exit 1; }
            echo "$files"
            code=false
            for f in $files; do
              case "$f" in
                docs/research/*|docs/runbooks/*|docs/design/*|README.md|ROADMAP.md|CONTRIBUTING.md|SECURITY.md|CHANGELOG.md|CLAUDE.md|NOTICE|LICENSE) ;;
                *) code=true ;;
              esac
            done
            # The SAFETY list lives in the Makefile (make safety uses it too).
            dirs=$(sed -n 's/^SAFETY *:= *//p' Makefile | tr ' ' '\n' | sed 's|^\./||; /^$/d')
            [ -n "$dirs" ] || { echo "no SAFETY list in the Makefile"; exit 1; }
            for d in $dirs; do
              if echo "$files" | grep -q "^$d/"; then safety=true; fi
            done
          fi
          if [ "$tier" = full ]; then shards='["1/3","2/3","3/3"]'; else shards='["1/2","2/2"]'; fi
          {
            echo "code=$code"
            echo "tier=$tier"
            echo "safety=$safety"
            echo "shards=$shards"
          } >> "$GITHUB_OUTPUT"
          echo "code=$code tier=$tier safety=$safety shards=$shards"

  lint:
    name: templ, fmt, vet, staticcheck, golangci-lint, govulncheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/go
        with:
          name: lint
          paths: |
            ~/.cache/golangci-lint
            ~/.cache/staticcheck
      - run: make templ-check fmt-check vet staticcheck lint vuln

  test:
    name: unit tests, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # git-mtimes.sh
      - uses: ./.github/actions/go
        with:
          name: test
          mtimes: "true"
      - env:
          TESTFLAGS: ${{ needs.changes.outputs.tier == 'full' && '-count=1' || '' }}
        run: make test build

  integration:
    name: integration tests (real decode-config)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # git-mtimes.sh
      - uses: ./.github/actions/go
        with:
          name: integration
          mtimes: "true"
      - name: install decode-config (pinned, verified)
        env:
          DECODER_VERSION: v16.0.0
          DECODER_SHA256: 00f6fde13ddae11b497252e7ddc421b35c009d3bc795cde219e0dd475a410622
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/dc.tgz" "https://github.com/tasmota/decode-config/releases/download/$DECODER_VERSION/decode-config-ubuntu-22.04.tar.gz"
          echo "$DECODER_SHA256  $RUNNER_TEMP/dc.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/decode-config" && tar -xzf "$RUNNER_TEMP/dc.tgz" -C "$RUNNER_TEMP/decode-config" decode-config
          "$RUNNER_TEMP/decode-config/decode-config" --version
      - name: integration tests
        env:
          REQUIRE_DECODER: "1"
          TESTFLAGS: ${{ needs.changes.outputs.tier == 'full' && '-count=1' || '' }}
        run: DECODER_PATH="$RUNNER_TEMP/decode-config/decode-config" make integration

  e2e:
    name: e2e ${{ needs.changes.outputs.tier == 'full' && 'all' || 'core' }} (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    container:
      # The image is the browser cache: its browsers and fonts match
      # @playwright/test in e2e/package.json; bump both together.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: install make (not in the Playwright image)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null
      - uses: actions/checkout@v7.0.1
      # The job container runs as root on a workspace owned by the runner user;
      # without this git refuses the repository and go build cannot stamp VCS info.
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/go
        with:
          name: e2e
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('e2e/package-lock.json') }}
      - name: install e2e dependencies
        run: make e2e-deps
      - name: e2e tests
        env:
          CI: "true"
          TARGET: ${{ needs.changes.outputs.tier == 'full' && 'e2e' || 'e2e-core' }}
          SHARD: ${{ matrix.shard }}
        run: |
          # One worker per two cores: every worker runs its own app, simulator
          # fleet and browser, and more made layout and timing tests flaky.
          n=$(( $(nproc) / 2 )); [ "$n" -lt 1 ] && n=1
          E2E_WORKERS=$n make "$TARGET" E2E_ARGS="--shard=$SHARD"
      - name: upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # FAST tier, only when a PR changes a SAFETY package: its race tests ...
  safety-race:
    name: safety race tests (changed safety packages)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.safety == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # diff against the PR base
      - uses: ./.github/actions/go
        with:
          name: race
          save: "false"
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          AUTH_PARTS: "4"
        run: make safety-race BASE="$BASE"

  # ... and the mutation gate of the changed mutation packages (see "mutation").
  race:
    name: unit tests (race detector)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/go
        with:
          name: race
      - run: make race

  # Mutation testing in three shards (one ota run alone takes 11 minutes on
  # one runner): each shard mutates its share of every package's files and
  # uploads the counts; mutation-gate adds them up and applies the thresholds.
  # FULL tier: every MUTATION package. FAST tier: only for PRs that change a
  # SAFETY package, and only the changed mutation packages (mutation-changed).
  mutation:
    name: mutation tests (${{ needs.changes.outputs.tier == 'full' && 'all' || 'changed' }}, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.tier == 'full' || needs.changes.outputs.safety == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # mutation-changed diffs against the PR base
      - uses: ./.github/actions/go
        with:
          name: mutation
          save: ${{ needs.changes.outputs.tier == 'full' }}
      - env:
          TARGET: ${{ needs.changes.outputs.tier == 'full' && 'mutation' || 'mutation-changed' }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          # The marker keeps the artifact non-empty when no mutation package changed.
          mkdir -p "$RUNNER_TEMP/counts" && echo "$SHARD" > "$RUNNER_TEMP/counts/shard"
          make "$TARGET" BASE="$BASE" MUTATION_SHARD="$SHARD" MUTATION_COUNTS="$RUNNER_TEMP/counts"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mutation-counts-${{ strategy.job-index }}
          path: ${{ runner.temp }}/counts
          if-no-files-found: error
          retention-days: 3

  mutation-gate:
    name: mutation gate
    needs: [changes, mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v7.0.0
        with:
          pattern: mutation-counts-*
          path: ${{ runner.temp }}/counts
      - env:
          ALL: ${{ needs.changes.outputs.tier == 'full' && '1' || '' }}
        run: make mutation-sum MUTATION_COUNTS="$RUNNER_TEMP/counts" MUTATION_SHARDS=3 MUTATION_ALL="$ALL"

  # Known-flaky tests, nightly (and dispatch) only, with retries. Never part of
  # "required": a failure here shows on the run but does not fail it.
  quarantine:
    name: quarantined tests (retries, not blocking)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: install make and gcc (race detector)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends make gcc libc6-dev >/dev/null
      - uses: actions/checkout@v7.0.1
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/go
        with:
          name: e2e
          save: "false"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('e2e/package-lock.json') }}
      - run: make e2e-deps
      - name: quarantined Go tests
        if: always()
        run: make test-quarantine
      - name: quarantined e2e tests
        if: always()
        env:
          CI: "true"
        run: E2E_WORKERS=2 make e2e-quarantine

  # The one status that branch protection on main requires. It always runs and
  # passes only when every job that had to run passed. A job may be skipped
  # only when its tier did not ask for it: everything for a docs-only PR, the
  # safety jobs when no SAFETY package changed, race and full mutation outside
  # the FULL tier. Any other result (failure, cancelled, or a skip caused by a
  # failed dependency) fails it. Mutation runs in FULL and for safety PRs.
  required:
    name: required
    needs: [changes, lint, test, integration, e2e, safety-race, mutation, mutation-gate, race]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: all gates passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TIER: ${{ needs.changes.outputs.tier }}
          SAFETY: ${{ needs.changes.outputs.safety }}
          ALWAYS: ${{ needs.lint.result }} ${{ needs.test.result }} ${{ needs.integration.result }} ${{ needs.e2e.result }}
          SAFETY_JOBS: ${{ needs.safety-race.result }}
          MUTATION: ${{ needs.mutation.result }} ${{ needs.mutation-gate.result }}
          FULL_ONLY: ${{ needs.race.result }}
        run: |
          echo "changes=$CHANGES code=$CODE tier=$TIER safety=$SAFETY"
          echo "always: $ALWAYS | safety: $SAFETY_JOBS | mutation: $MUTATION | full only: $FULL_ONLY"
          [ "$CHANGES" = success ] || exit 1
          docs=false; [ "$CODE" = false ] && docs=true
          check() { # check <skip allowed> <result...>
            allowed=$1; shift
            for r in "$@"; do
              [ "$r" = success ] && continue
              [ "$r" = skipped ] && [ "$allowed" = true ] && continue
              echo "unexpected result: $r"; exit 1
            done
          }
          check "$docs" $ALWAYS
          s=$docs; [ "$SAFETY" = true ] || s=true
          check "$s" $SAFETY_JOBS
          f=$docs; [ "$TIER" = full ] || f=true
          check "$f" $FULL_ONLY
          m=$docs; [ "$TIER" = full ] || [ "$SAFETY" = true ] || m=true
          check "$m" $MUTATION

  # Release: a tag publishes the image only when the FULL tier passed.
  publish:
    name: publish image (tags)
    needs: required
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
