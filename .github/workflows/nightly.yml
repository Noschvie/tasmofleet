# Nightly (cron on main) and by hand: the FULL tier. It blocks no release and no merge; a
# failing night opens an issue (job nightly-failure-issue, schedule only).
#
#   checks          lint, unit tests (-count=1: uncached), build, integration tests, EVERY e2e
#                   test in three shards plus the MQTT specs in a job of their own (layout and
#                   visual guards), the Tasmota command catalogue check (_checks.yml)
#   race            every unit test with the race detector, in two shards
#   mutation        the full mutation run and its gate (_mutation.yml, scope all)
#   quarantine      the tests tagged @quarantine / quarantine.Test, with retries; never blocking
#   ha-app          the Home Assistant app in a real Supervisor (#442)
#   ghcr-cleanup    prune the registries (a manual run only previews: dry-run)
#
# The jobs also save the Go caches that pull requests restore (from main only, see
# .github/actions/go); the e2e caches are refreshed only here.
name: nightly

on:
  schedule:
    # GitHub starts this workflow 5 to 8 hours after its cron time (nine nights measured, 2026-10-25 to
    # 2026-11-02: 02:23 became 07:41 to 09:40), whatever the hour of the cron, so the run lands in working
    # hours. 22:37 UTC aims at the early morning instead (#485). Check "created" of the last runs with
    # `gh run list --workflow nightly.yml --event schedule`; the minute is off the hour on purpose.
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group: a push to main must not cancel the nightly run.
concurrency:
  group: nightly-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NICE: ""

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/_checks.yml
    with:
      e2e: all
      e2e_shards: '["1/3","2/3","3/3"]'
      testflags: "-count=1"
      catalogue: true

  race:
    name: unit tests (race detector, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # tools/race.sh: 1/2 is internal/auth alone (about half of all race time, run in 4
        # parts), 2/2 every other package; make shards-check fails when a package is in neither.
        # "cache" is the Go cache this shard saves. The safety-race job (_checks.yml) restores
        # race-1: it builds the SAFETY packages' dependencies with -race, which shard 2/2 has built (#523).
        include:
          - shard: "1/2"
            cache: race-0
          - shard: "2/2"
            cache: race-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go
        with:
          name: ${{ matrix.cache }}
      - env:
          RACE_SHARD: ${{ matrix.shard }}
          AUTH_PARTS: "4"
        run: make race

  mutation:
    name: mutation
    uses: ./.github/workflows/_mutation.yml
    with:
      scope: all

  # Known-flaky tests, with retries. Never part of anything that gates: a failure here shows
  # on the run but does not fail it.
  quarantine:
    name: quarantined tests (retries, not blocking)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - name: install make and gcc (race detector)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends make gcc libc6-dev >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/go
        with:
          name: e2e
          save: "false"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('e2e/package-lock.json') }}
      - run: make e2e-deps
      - name: quarantined Go tests
        if: always()
        run: make test-quarantine
      - name: quarantined e2e tests
        if: always()
        env:
          CI: "true"
        run: E2E_WORKERS=2 make e2e-quarantine

  # The Home Assistant app in a real Supervisor (#442): installs deploy/homeassistant/tasmofleet into the
  # Supervisor of the official Home Assistant devcontainer, starts it, checks /readyz and the backup/restore
  # round trip (tools/ha-app-devcontainer-test.sh). Slow (pulls the Supervisor images) and privileged, so it
  # never runs on pull requests. No secrets; the passwords in the script are fake. Not published anywhere.
  ha-app:
    name: Home Assistant app in a Supervisor (devcontainer)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ha
          platforms: linux/amd64
          load: true
          provenance: false
          tags: tasmofleet-ha:ci
          build-args: |
            VERSION=ci
            WITH_DECODER=false
          cache-from: type=gha
      - name: install, start, readyz, backup and restore in the Supervisor
        run: timeout 1500 tools/ha-app-devcontainer-test.sh tasmofleet-ha:ci

  # Registry cleanup: deletes only when the schedule started the run.
  ghcr-cleanup:
    name: ghcr-cleanup
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr-cleanup.yml
    with:
      dry-run: ${{ github.event_name != 'schedule' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The nightly blocks no release, so its failure must not go unseen: one open issue
  # "Nightly FULL failed ..." (labels ci, flaky) collects the runs; a later failing night
  # comments on it instead of opening a second one. The body lists the failed tests and the commits
  # since the last green night (_failure-issue.yml).
  nightly-failure-issue:
    name: nightly failure issue
    needs: [checks, race, mutation, ha-app, ghcr-cleanup]
    # Only the scheduled run on main reports; a manual run, from any branch, never touches the issue.
    if: ${{ failure() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/_failure-issue.yml
    with:
      title: Nightly FULL failed on main
      labels: ci,flaky
      workflow: nightly.yml
