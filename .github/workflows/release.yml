# Release: a tag vX.Y.Z (signed, set on a green commit of main; docs/dev/releasing.md).
#
#   guards --> publish --> release --> pages
#
# guards   the tagged commit is on main, the CHANGELOG.md section for the tag exists and a patch
#          tag changes no migration, so a bad tag fails in seconds (the image build checks the
#          section again). It also fails when a migration shipped in the previous tag was modified, renamed or
#          deleted (`make migration-append-only`, #595). And it fails, with the reason, unless the
#          tagged commit already has a successful "required" check of pr.yml and a successful main.yml
#          run (tools/release-green.sh, #554): main only moves by a fast-forward push of a green PR
#          head, so the tag run does not run the FAST tier again on identical code. The race tests of
#          the SAFETY packages stay in the nightly FULL tier (same main).
# publish  the image to ghcr.io and Docker Hub (_image.yml, mode release), only when guards succeeded.
#          The only job that can push a tag image: _image.yml refuses mode release for anything but a
#          tag push.
# release  the GitHub release, its notes the CHANGELOG.md section, only when publish succeeded.
# pages    the static demo, only when the release was made.
# A tag whose guards fail publishes no image, no release and no pages.
#
# workflow_dispatch is a dry run: it runs ONLY the check for "required" and main.yml on `sha` (default:
# the head of the ref) and never publishes, releases or deploys anything, whatever the result.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sha:
        description: "Dry run: the commit whose green required and main.yml run to verify (default: the head of the ref). Publishes nothing."
        required: false
        type: string

permissions:
  contents: read

# Never cancel a release in flight; a second run for the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NICE: ""

jobs:
  guards:
    name: changelog and migration guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the main.yml run of the tagged commit
      checks: read # its "required" check run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # migration-guard compares with the previous tag
      - if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Tags are set on a commit of main (docs/dev/releasing.md); a v* tag anywhere else must not publish.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag $TAG points to $GITHUB_SHA, which is not on main" >&2
            exit 1
          }
          make changelog-check TAG="$TAG"
          # Patch releases never touch the migrations.
          make migration-guard TAG="$TAG" REV="$GITHUB_SHA"
          # No release ever edits, renames or deletes a migration shipped in the previous tag (#595).
          make migration-append-only TAG="$TAG" REV="$GITHUB_SHA"
      # The commit was checked as a pull request and on main already (#554); a dry run checks the commit of its input.
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
        run: tools/release-green.sh "$SHA"

  # Explicit status checks on every job below: the implicit success() also looks at the
  # skipped ancestors of a job (the first release workflow lost its publish job to that).
  publish:
    name: publish image
    needs: guards
    if: ${{ !cancelled() && github.event_name == 'push' && needs.guards.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      mode: release
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # A GitHub release per tag, its notes the CHANGELOG.md section, once the image is out.
  release:
    name: GitHub release
    needs: publish
    if: ${{ !cancelled() && github.event_name == 'push' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          make -s changelog-notes TAG="$TAG" > notes.md
          title=$(make -s changelog-title TAG="$TAG")
          pre=; case "$TAG" in *-*) pre=--prerelease ;; esac
          gh release create "$TAG" --verify-tag --title "$title" --notes-file notes.md $pre

  # The static demo of the released version (pages.yml, also run by hand).
  pages:
    name: demo site
    needs: release
    if: ${{ !cancelled() && github.event_name == 'push' && needs.release.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
