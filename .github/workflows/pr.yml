# Pull requests: the FAST tier. One workflow per trigger (CLAUDE.md "Test tiers in CI"):
# pr.yml (this), main.yml (push to main), release.yml (tags), nightly.yml and weekly.yml (cron). The jobs
# they share are the reusable workflows _checks.yml, _mutation.yml (weekly only), _image.yml and _ha-app.yml; the file
# a run comes from says which tier it is, nothing is computed at run time except which
# parts of the repository the PR touched (job "changes").
#
# FAST: lint, unit and integration tests (unchanged packages come from the go test cache that
# main.yml saves; a PR saves none), the @core e2e tests in two shards plus the MQTT specs in a job of their own, the
# revert check (a PR that changes Go code and its tests: the tests fail without the change) and, when the PR changes
# a SAFETY package (Makefile), its race tests and diff coverage (every changed line is executed by a test).
# No mutation testing in the PR path (#555): the weekly run keeps it. Target: "required" green in <= 5 min.
# Docs-only PRs skip all of that. The relative Markdown link check runs on every PR and gates
# the merge: a PR that deletes or renames a linked file breaks links without touching Markdown.
# The migration append-only guard (#595) runs on every PR too and gates the merge. So does the release
# guard (#556): a PR whose tip adds a new "## X.Y.Z" section to CHANGELOG.md is the release commit of a
# merge train and runs the tag's CHANGELOG and migration guards (make release-pr-check) before the tag exists.
# The job "required" is the single status check for branch protection; it always runs.
#
# No paths filter on the trigger: "changes" decides, and "required" always reports.
# Docs that are NOT safe to ignore, because a test or the build reads them: CHANGELOG.md
# (embedded by internal/changelog, TestEmbeddedChangelog), docs/security
# (cmdpolicy test reads command-policy.md), docs/configuration.md (configdoc_test checks it
# against the env tags), docs/spec (design-system.md is read by a test), assets/branding
# (branding test compares copies), deploy (metrics/config tests read it), design/v2 (token
# test), testdata, internal/web/static and templates (embedded).
name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  NICE: ""

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      safety: ${{ steps.classify.outputs.safety }}
      gocode: ${{ steps.classify.outputs.gocode }}
      catalogue: ${{ steps.classify.outputs.catalogue }}
      image: ${{ steps.classify.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Fail closed: without a base or a diff, the gate fails instead of
          # treating the PR as docs-only.
          [ -n "$BASE" ] || { echo "no base sha"; exit 1; }
          files=$(git diff --name-only "$BASE"...HEAD)
          [ -n "$files" ] || { echo "empty diff"; exit 1; }
          echo "$files"
          code=false
          safety=false
          gocode=false
          catalogue=false
          image=false
          for f in $files; do
            case "$f" in
              docs/research/*|docs/runbooks/*|docs/design/*|README.md|ROADMAP.md|CONTRIBUTING.md|SECURITY.md|CLAUDE.md|NOTICE|LICENSE) ;;
              *) code=true ;;
            esac
            case "$f" in *.go) gocode=true ;; esac
            # The image build check: what the Dockerfile reads and the Home Assistant app.
            case "$f" in
              Dockerfile|.dockerignore|go.mod|go.sum|.github/workflows/_image.yml|.github/workflows/_ha-app.yml|internal/config/haprofile.go|tools/ha-app-smoke.sh|deploy/homeassistant/*) image=true ;;
            esac
          done
          # The SAFETY list lives in the Makefile (make safety uses it too).
          dirs=$(sed -n 's/^SAFETY *:= *//p' Makefile | tr ' ' '\n' | sed 's|^\./||; /^$/d')
          [ -n "$dirs" ] || { echo "no SAFETY list in the Makefile"; exit 1; }
          for d in $dirs; do
            if echo "$files" | grep -q "^$d/"; then safety=true; fi
          done
          # The catalogue generator, its data and the pinned source (Makefile) decide the catalogue job.
          if echo "$files" | grep -Eq '^(internal/tasmotacmd/|cmd/tasmofleet-catalogue/|Makefile$)'; then catalogue=true; fi
          {
            echo "code=$code"
            echo "safety=$safety"
            echo "gocode=$gocode"
            echo "catalogue=$catalogue"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
          echo "code=$code safety=$safety gocode=$gocode catalogue=$catalogue image=$image"

  # lint, unit and integration tests, build, e2e core; safety-race and diff coverage when a SAFETY package
  # changed, the revert check when Go code changed, catalogue when the generator, its data or the pinned source
  # changed. The revert check reads the PR's label and body through the API (pull-requests: read).
  checks:
    name: checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_checks.yml
    with:
      e2e: core
      e2e_shards: '["1/2","2/2"]'
      safety_race: ${{ needs.changes.outputs.safety == 'true' }}
      diff_cover: ${{ needs.changes.outputs.safety == 'true' }}
      revert_check: ${{ needs.changes.outputs.gocode == 'true' }}
      pr_number: ${{ github.event.pull_request.number }}
      base: ${{ github.event.pull_request.base.sha }}
      catalogue: ${{ needs.changes.outputs.catalogue == 'true' }}

  # Relative links in the Markdown files resolve (tools/check-doc-links.py, about 8 s). Part of "required".
  # No condition: it also runs for a code PR, whose change can delete a file that a document links to.
  links:
    name: relative Markdown links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I tools/check-doc-links.py .

  # Migrations are append-only (#595): no file that exists at the latest release tag may be modified, renamed or
  # deleted. Runs on every PR (a docs-only PR cannot touch them, the check is a second) and is part of "required".
  migrations:
    name: migrations append-only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guard compares with the latest release tag
      - run: make migration-append-only

  # The release commit rides in the merge train (#556): when the tip adds a new "## X.Y.Z" section to CHANGELOG.md,
  # the guards of the tag run here (make release-pr-check: changelog-check and migration-guard), so the tag run finds
  # no surprise. No new section: passes at once. Part of "required".
  release-section:
    name: release section guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff with the base, and the tags migration-guard compares with
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: make release-pr-check BASE="$BASE"

  # Build only, nothing is pushed: proves the Dockerfile still builds for both architectures (#522). Part of
  # "required" when the PR touches what the image reads: a Renovate bump of the base image or of a Go
  # dependency that breaks the build must not merge. The job grants what the called workflow asks for; a
  # fork's token stays read-only whatever is asked, and no secret is passed.
  image:
    name: image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      mode: check

  # The Home Assistant app image (build and smoke test), called apart from the image above and NOT part of
  # "required": it can be red on its own and never blocks a merge (#522).
  ha-app:
    name: ha-app
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_ha-app.yml

  # The one status that branch protection on main requires. It always runs and
  # passes only when every job that had to run passed. "checks" is a
  # reusable workflow: it is green only when every job inside it that was asked for
  # (by the inputs above: safety race, diff coverage and revert check among them) ran and succeeded. A skip
  # counts only when this PR did not ask for that job: everything for a docs-only PR. The link
  # check, the migration guard and the release section guard always run and must succeed; the image build
  # must succeed when the PR touched what the image reads, and is skipped otherwise. The Home Assistant app
  # image is not in "needs".
  # Any other result (failure, cancelled, or a skip caused by a failed dependency) fails it.
  required:
    name: required
    needs: [changes, checks, links, migrations, release-section, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: all gates passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SAFETY: ${{ needs.changes.outputs.safety }}
          CHECKS: ${{ needs.checks.result }}
          LINKS: ${{ needs.links.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          RELEASE_SECTION: ${{ needs.release-section.result }}
          IMAGE_WANTED: ${{ needs.changes.outputs.image }}
          IMAGE: ${{ needs.image.result }}
        run: |
          echo "changes=$CHANGES code=$CODE safety=$SAFETY | checks: $CHECKS | links: $LINKS | migrations: $MIGRATIONS | release section: $RELEASE_SECTION | image (wanted: $IMAGE_WANTED): $IMAGE"
          [ "$CHANGES" = success ] || exit 1
          docs=false; [ "$CODE" = false ] && docs=true
          check() { # check <skip allowed> <result>
            [ "$2" = success ] && return 0
            [ "$2" = skipped ] && [ "$1" = true ] && return 0
            echo "unexpected result: $2"; exit 1
          }
          check "$docs" "$CHECKS"
          check false "$LINKS"
          check false "$MIGRATIONS"
          check false "$RELEASE_SECTION"
          img=true; [ "$IMAGE_WANTED" = true ] && img=false
          check "$img" "$IMAGE"
