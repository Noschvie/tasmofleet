# Home Assistant app image (Dockerfile target "ha", deploy/homeassistant): build and smoke test, nothing is
# pushed (publishing it comes with #444). Reusable; never triggered on its own. It is a workflow of its own,
# not a job of _image.yml, so that a failure is red on its own and never stops the Docker/Unraid image from being
# published, and never blocks a pull request: pr.yml and main.yml call it, and neither "required" nor ghcr-cleanup
# wait for it (#522). Not run for a release: the app image is not part of the release yet, and the tagged commit
# has run this on main.
# Layers come from the GitHub Actions cache that main.yml's :edge build saves; this workflow saves none.
name: ha-app

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ha-app:
    name: Home Assistant app image (build and test, not published)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: tasmofleet:smoke-default
          build-args: WITH_DECODER=false
          cache-from: type=gha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ha
          platforms: linux/amd64
          load: true
          provenance: false
          tags: tasmofleet-ha:smoke
          build-args: |
            VERSION=ci
            WITH_DECODER=false
          cache-from: type=gha
      - name: HA app image smoke run (started like the Supervisor starts it)
        run: tools/ha-app-smoke.sh tasmofleet-ha:smoke tasmofleet:smoke-default
      # The aarch64 stage and its io.hass.arch label are cross-built and inspected on every run (no
      # emulation, the container is not started here).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ha
          platforms: linux/arm64
          load: true
          provenance: false
          tags: tasmofleet-ha:smoke-arm64
          build-args: |
            VERSION=ci
            WITH_DECODER=false
          cache-from: type=gha
      - name: HA app image for arm64 carries the aarch64 label
        run: |
          set -eu
          i=tasmofleet-ha:smoke-arm64
          [ "$(docker image inspect -f '{{.Architecture}}' $i)" = arm64 ]
          [ "$(docker image inspect -f '{{index .Config.Labels "io.hass.arch"}}' $i)" = aarch64 ]
          [ "$(docker image inspect -f '{{index .Config.Labels "io.hass.type"}}' $i)" = app ]
          [ "$(docker image inspect -f '{{.Config.User}}' $i)" = root ]
