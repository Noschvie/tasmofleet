# GitHub Pages: the website (site/) at https://nofuturekid.github.io/tasmofleet/ and the static demo
# under /demo/. `make pages` assembles dist/pages; its demo part comes from `make demo`, which runs
# the real binaries against tasmofleet-devenv with the design fixture fleet (60 simulated
# devices, documentation addresses only) and saves the pages an admin reaches as static HTML
# (e2e/tests/demo-site.spec.ts). Called by release.yml after the GitHub release was made, and by hand;
# the output is never committed.
name: pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NICE: ""

jobs:
  build:
    name: build the website and the demo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Browsers in this image match @playwright/test in e2e/package.json; bump both together (as in _checks.yml).
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - name: install make (not in the Playwright image)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Restore-only: this runs under the tag's ref, whose caches nothing else could use (#476). The
      # e2e job's Go cache on main has the same builds (app and devenv).
      - uses: ./.github/actions/go
        with:
          name: e2e
          save: "false"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('e2e/package-lock.json') }}
      - name: install e2e dependencies
        run: make e2e-deps
      - name: build the website and the demo
        env:
          CI: "true"
        run: make pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One deployment at a time (a job-level group: this workflow is also called by release.yml).
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
